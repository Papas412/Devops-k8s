services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  api:
    image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab-api:latest
    environment:
      DATABASE_URL: postgresql://desk:desk@postgres:5432/desk
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  worker:
    image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab-worker:latest
    environment:
      DATABASE_URL: postgresql://desk:desk@postgres:5432/desk
      POLL_SECONDS: "5"
    depends_on:
      - postgres

  web:
    image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-lab-web:latest
    ports:
      - "8080:8080"
